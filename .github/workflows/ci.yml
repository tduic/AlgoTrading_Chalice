name: CI

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ vars.CI_RUNNER == 'local' && fromJSON('["self-hosted","linux","ARM64","tduic-local"]') || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.15"
      # chalice, tda, boto3, requests_oauthlib and selenium are stubbed by
      # tests/conftest.py (TD Ameritrade's API no longer exists); only the
      # pure-Python market-calendar deps are installed for real.
      - name: Install test dependencies
        run: python -m pip install --upgrade pip -r requirements-dev.txt
      - name: Byte-compile (warnings are errors)
        run: python -W error -m compileall -q -x '/\.git/' .
      - name: Run tests (offline; no AWS, broker or browser)
        run: python -m pytest -v
